[project]
name = "persona-neurons"
version = "0.1.0"
description = "Neuron-level origins of misaligned personas in OLMo 2 1B"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Direct dependencies are pinned exactly. The full dependency tree is pinned in uv.lock.
dependencies = [
    "torch==2.14.1",
    "transformers==5.22.1",
    "tokenizers==0.23.3",
    "huggingface_hub==2.3.0",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
    # Only the local judge needs these two (4-bit loading of a 7-8B model).
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["persona_neurons"]

[tool.uv]
# Resolve only against packages published on or before this date, so a fresh
# `uv lock` cannot silently pull in a brand-new release.
exclude-newer = "2026-10-30T23:59:59Z"

[tool.ruff]
line-length = 100
# data/ holds unmodified third-party files; never reformat them.
extend-exclude = ["data"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]


[tool.pytest.ini_options]
testpaths = ["tests"]
